name: Hola Mundo

on:
  push:
    branches:
      - aprendiendo-github-actions
  pull_request:
    branches:
      - main

jobs:
  ejecutar-hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script Hola Mundo
        run: python hola_mundo.py